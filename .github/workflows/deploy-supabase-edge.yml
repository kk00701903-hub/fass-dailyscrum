# Supabase Edge Functions — GitHub Pages 수동 JIRA 동기화용
#
# 필수 Secrets (jira-sync.yml 과 동일 + 배포용):
#   SUPABASE_ACCESS_TOKEN   Supabase Dashboard → Account → Access Tokens
#   SUPABASE_PROJECT_REF    예: cvnyayoddcxhigjtyuqb
#   JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN, JIRA_BOARD_ID
#   (SUPABASE_URL · SERVICE_ROLE_KEY 는 Edge 에 자동 주입 — secrets set 불필요)

name: Deploy Supabase Edge

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-edge.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deploy secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BOARD_ID: ${{ secrets.JIRA_BOARD_ID }}
        run: |
          missing=""
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JIRA_BASE_URL JIRA_EMAIL JIRA_API_TOKEN JIRA_BOARD_ID; do
            eval "val=\$$key"
            if [ -z "$val" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for Edge deploy:$missing"
            exit 1
          fi

          # 복사 시 붙는 공백·줄바꿈·따옴표 제거 후 이후 단계에서 동일 값 사용
          TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//")"
          case "$TOKEN" in
            sbp_*) ;;
            eyJ*)
              echo "::error::SUPABASE_ACCESS_TOKEN 에 JWT(eyJ...)를 넣으셨습니다. service_role / anon 키가 아닙니다."
              echo "::error::https://supabase.com/dashboard/account/tokens 에서 sbp_ 로 시작하는 토큰을 새로 만드세요."
              exit 1
              ;;
            sb_*)
              echo "::error::SUPABASE_ACCESS_TOKEN 에 API 키(sb_publishable_/sb_secret_)를 넣으셨습니다."
              echo "::error::Account → Access Tokens 의 sbp_ 토큰이 필요합니다."
              exit 1
              ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN 형식 오류: 접두사가 sbp_ 가 아닙니다 (현재: ${TOKEN:0:12}...)."
              echo "::error::Supabase → Account Settings → Access Tokens → Generate new token"
              exit 1
              ;;
          esac
          if [ "${#TOKEN}" -lt 40 ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 이 너무 짧습니다. 토큰 전체가 복사됐는지 확인하세요."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN prefix=${TOKEN:0:8}... length=${#TOKEN}"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Deploy secrets present."

      - name: Set Edge Function secrets
        env:
          JIRA_STORY_POINTS_FIELD: ${{ secrets.JIRA_STORY_POINTS_FIELD }}
        run: |
          # SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY 는 Edge 런타임이 자동 주입 — secrets set 시 오류 남
          set -e
          if [ -n "$JIRA_STORY_POINTS_FIELD" ]; then
            supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
              JIRA_BASE_URL="${{ secrets.JIRA_BASE_URL }}" \
              JIRA_EMAIL="${{ secrets.JIRA_EMAIL }}" \
              JIRA_API_TOKEN="${{ secrets.JIRA_API_TOKEN }}" \
              JIRA_BOARD_ID="${{ secrets.JIRA_BOARD_ID }}" \
              JIRA_STORY_POINTS_FIELD="$JIRA_STORY_POINTS_FIELD"
          else
            supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
              JIRA_BASE_URL="${{ secrets.JIRA_BASE_URL }}" \
              JIRA_EMAIL="${{ secrets.JIRA_EMAIL }}" \
              JIRA_API_TOKEN="${{ secrets.JIRA_API_TOKEN }}" \
              JIRA_BOARD_ID="${{ secrets.JIRA_BOARD_ID }}"
          fi

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy sync-jira-all jira-proxy sync-jira-sprints \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Summary
        run: |
          echo "Deployed: sync-jira-all, jira-proxy, sync-jira-sprints"
          echo "GitHub Pages 수동 동기화 버튼이 Edge Function 을 호출합니다."
