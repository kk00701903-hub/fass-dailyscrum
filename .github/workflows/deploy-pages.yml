# FASS Scrum → GitHub Pages (https://kk00701903-hub.github.io/fass-dailyscrum/)
#
# gh-pages 브랜치에 빌드 결과를 push한 뒤, Pages 소스를 gh-pages 브랜치로 자동 전환합니다.
# (소스가 "GitHub Actions"로 남아 있으면 예전 배포본이 계속 보입니다.)
#
# 빌드용 Secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_JIRA_* 등

name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          if [ -z "$VITE_SUPABASE_URL" ]; then
            VITE_SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          fi
          export VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            VITE_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          fi
          export VITE_SUPABASE_ANON_KEY
          export VITE_JIRA_BOARD_ID="${{ secrets.VITE_JIRA_BOARD_ID }}"
          # JIRA 토큰은 Edge Function 에만 — Pages 번들에 넣으면 push protection 에 걸림
          export VITE_GRAFANA_DASHBOARD_EMBED_URL="${{ secrets.VITE_GRAFANA_DASHBOARD_EMBED_URL }}"
          export VITE_JIRA_STORY_POINTS_FIELD="${{ secrets.VITE_JIRA_STORY_POINTS_FIELD }}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL 및 VITE_SUPABASE_ANON_KEY(또는 SUPABASE_ANON_KEY) Secret 이 필요합니다."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *xxxx*|*/rest/v1*)
              echo "::error::VITE_SUPABASE_URL 형식 오류: https://프로젝트ref.supabase.co 만 (xxxx placeholder /rest/v1 금지)"
              exit 1
              ;;
          esac
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Set Pages source to gh-pages branch
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source: { branch: "gh-pages", path: "/" },
              });
              core.info("OK: Pages source → gh-pages branch");
            } catch (e) {
              core.warning(
                "Could not change Pages source via API. Set manually: " +
                  "Settings → Pages → Deploy from branch → gh-pages / (root)"
              );
              core.warning(String(e?.message ?? e));
            }
