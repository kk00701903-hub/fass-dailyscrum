# FASS Scrum → GitHub Pages (https://kk00701903-hub.github.io/fass-dailyscrum/)
#
# 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# 빌드 시 앱 연동용 Secrets (Repository secrets, VITE_ 접두사):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   VITE_JIRA_BASE_URL, VITE_JIRA_EMAIL, VITE_JIRA_API_TOKEN, VITE_JIRA_BOARD_ID
# 선택: VITE_GRAFANA_DASHBOARD_EMBED_URL, VITE_JIRA_STORY_POINTS_FIELD

name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_JIRA_BASE_URL: ${{ secrets.VITE_JIRA_BASE_URL }}
          VITE_JIRA_EMAIL: ${{ secrets.VITE_JIRA_EMAIL }}
          VITE_JIRA_API_TOKEN: ${{ secrets.VITE_JIRA_API_TOKEN }}
          VITE_JIRA_BOARD_ID: ${{ secrets.VITE_JIRA_BOARD_ID }}
          VITE_GRAFANA_DASHBOARD_EMBED_URL: ${{ secrets.VITE_GRAFANA_DASHBOARD_EMBED_URL }}
          VITE_JIRA_STORY_POINTS_FIELD: ${{ secrets.VITE_JIRA_STORY_POINTS_FIELD }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
