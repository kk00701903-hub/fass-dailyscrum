# FASS Scrum → GitHub Pages (https://kk00701903-hub.github.io/fass-dailyscrum/)
#
# gh-pages 브랜치에 빌드 결과를 push한 뒤, Pages 소스를 gh-pages 브랜치로 자동 전환합니다.
# (소스가 "GitHub Actions"로 남아 있으면 예전 배포본이 계속 보입니다.)
#
# 빌드용 Secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_JIRA_* 등

name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_JIRA_BASE_URL: ${{ secrets.VITE_JIRA_BASE_URL }}
          VITE_JIRA_EMAIL: ${{ secrets.VITE_JIRA_EMAIL }}
          VITE_JIRA_API_TOKEN: ${{ secrets.VITE_JIRA_API_TOKEN }}
          VITE_JIRA_BOARD_ID: ${{ secrets.VITE_JIRA_BOARD_ID }}
          VITE_GRAFANA_DASHBOARD_EMBED_URL: ${{ secrets.VITE_GRAFANA_DASHBOARD_EMBED_URL }}
          VITE_JIRA_STORY_POINTS_FIELD: ${{ secrets.VITE_JIRA_STORY_POINTS_FIELD }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Set Pages source to gh-pages branch
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source: { branch: "gh-pages", path: "/" },
              });
              core.info("OK: Pages source → gh-pages branch");
            } catch (e) {
              core.warning(
                "Could not change Pages source via API. Set manually: " +
                  "Settings → Pages → Deploy from branch → gh-pages / (root)"
              );
              core.warning(String(e?.message ?? e));
            }
